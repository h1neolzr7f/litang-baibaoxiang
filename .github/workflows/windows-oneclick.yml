name: windows-oneclick

on:
  pull_request:
    paths:
      - "app/**"
      - "tools/refresh_release_oneclick.py"
      - ".github/workflows/windows-oneclick.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/refresh_release_oneclick.py"
      - ".github/workflows/windows-oneclick.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-oneclick:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download previous full Windows runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force seed | Out-Null
          gh release download v2.4.3 --pattern "*.zip" --dir seed
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -Recurse -Force seed
            New-Item -ItemType Directory -Force seed | Out-Null
            gh release download v2.4.3 --dir seed
          }
          Get-ChildItem seed | Format-Table Name,Length

      - name: Refresh full one-click package
        shell: pwsh
        run: |
          python tools/refresh_release_oneclick.py --seed-dir seed --dist-dir dist

      - name: Upload Windows one-click artifact
        uses: actions/upload-artifact@v4
        with:
          name: 理塘百宝箱-Windows-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw "没有找到 Windows 一键包 ZIP" }

          # GitHub CLI / Windows 控制台对中文文件名的参数编码偶尔会丢前缀。
          # Release 资产统一使用稳定的 ASCII 文件名，避免出现 "-Windows-vX.Y.Z.zip"。
          $releaseName = "litang-baibaoxiang-Windows-v$version.zip"
          $releaseZip = Join-Path $zip.DirectoryName $releaseName
          Copy-Item $zip.FullName $releaseZip -Force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 清理旧工作流曾生成的残缺文件名。文件名以 "-" 开头时 CLI 参数解析不可靠，
            # 因此直接查询 Release asset id，再走 GitHub API 删除。
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            $staleAssets = @($release.assets | Where-Object { $_.name -eq "-Windows-v$version.zip" })
            foreach ($asset in $staleAssets) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
            }
            gh release upload $tag $releaseZip --clobber
          } else {
            gh release create $tag $releaseZip --target "$env:GITHUB_SHA" --title "理塘百宝箱 $tag" --notes "Windows 10/11 64 位完整一键包。解压后双击「启动理塘百宝箱.bat」即可使用。包含完整打码运行时、检测模型和 Real-CUGAN；源码与该版本标签一致。"
          }
